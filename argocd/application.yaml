apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deployflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aavantika-r/deployflow.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: deployflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
