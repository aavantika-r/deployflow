<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeployFlow</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: grid; place-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem 3rem; border-radius: 12px; text-align: center; }
    code { background: #334155; padding: 2px 8px; border-radius: 6px; }
    li { list-style: none; margin: .4rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DeployFlow</h1>
    <p>Version: <code>{{ version }}</code></p>
    <ul>
      <li>GitHub Actions &rarr; Security scans</li>
      <li>Docker Hub &rarr; Argo CD &rarr; Kubernetes</li>
    </ul>
  </div>
</body>
</html>
