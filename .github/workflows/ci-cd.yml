name: CI-CD
on:
  push:
    branches: [main]
    paths-ignore: ["k8s/**", "README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: SAST - Bandit
        run: |
          pip install bandit
          bandit -r app.py -ll

      - name: Secret scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency + k8s misconfig scan - Trivy fs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-push:
    needs: test-and-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: avan0/deployflow:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

      - name: Image scan - Trivy (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: avan0/deployflow:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image (only if scan passed)
        run: |
          docker tag avan0/deployflow:${{ github.sha }} avan0/deployflow:latest
          docker push avan0/deployflow:${{ github.sha }}
          docker push avan0/deployflow:latest

      - name: Update image tag in git (Argo CD picks this up)
        run: |
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|" k8s/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "ci: deploy ${GITHUB_SHA::7}" || exit 0
          git push
